    \ bars, poems and hooks over beats, with rhymes on tap\">\n<meta name=\"twitter:card\" content=\"summary_large_image\"\
    >\n<meta name=\"twitter:title\" content=\"Yabanana: write lyrics, raps and poems over beats\">\n<meta name=\"twitter:description\"\
